name: Chromatic

on:
  pull_request:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required by Chromatic to detect baseline commits

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: npm ci

      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true # don't fail the check on visual changes, just report them
